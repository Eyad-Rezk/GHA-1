name: Input/Output-workflow
on:
    workflow_dispatch:
        inputs:
            gender:
              description: "what's your type"
              required: true
              default: "male"
              type: choice
              options:
                - male
                - female
            name:
                required: true
                

jobs:
    job-1:
        runs-on: ubuntu-latest
        steps:
          - name: first-step
            run: echo "HI ${{ inputs.gender }} ${{ inputs.name }}"
